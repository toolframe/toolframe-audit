[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-audit-example"
version = "0.1.0"
description = "A small Toolframe producer showing same-transaction Audit outbox delivery"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "toolframe-sdk==0.4.0",
    "toolframe-audit==0.2.0",
]

[project.entry-points."toolframe.plugins"]
audit-example = "toolframe_audit_example.plugin:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_audit_example"]

[tool.ruff]
target-version = "py314"
