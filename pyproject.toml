[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-audit"
version = "0.1.0"
description = "Durable source-fenced audit events and transactional outbox helpers for Toolframe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.3.0"]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-audit"
Repository = "https://github.com/toolframe/toolframe-audit"
Documentation = "https://github.com/toolframe/toolframe-audit#readme"
Issues = "https://github.com/toolframe/toolframe-audit/issues"

[project.optional-dependencies]
ui = ["streamlit>=1.61,<2"]

[project.entry-points."toolframe.plugins"]
audit = "toolframe_audit.plugin:plugin"

[dependency-groups]
dev = [
    "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "build>=1,<2",
    "toolframe-storage-sqlite==0.3.1", "toolframe-core==0.6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

[tool.uv.sources]
toolframe-core = { path = "../toolframe-core", editable = true }
toolframe-sdk = { path = "../toolframe-sdk", editable = true }
toolframe-storage-sqlite = { path = "../toolframe-storage-sqlite", editable = true }
